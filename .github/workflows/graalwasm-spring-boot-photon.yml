name: Test GraalWasm Spring Boot Photon Demo
on:
  pull_request:
    paths:
      - 'graalwasm/graalwasm-spring-boot-photon/**'
      - '.github/workflows/graalwasm-spring-boot-photon.yml'
      - '.github/scripts/wait-for-http.sh'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    name: 'graalwasm-spring-boot-photon'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: graalvm/setup-graalvm@v1.6.9
        with:
          version: '25.4'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'
          native-image-job-reports: 'true'
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Package 'graalwasm-spring-boot-photon'
        run: |
          cd graalwasm/graalwasm-spring-boot-photon
          ./mvnw --no-transfer-progress clean package
      - name: Build native 'graalwasm-spring-boot-photon'
        run: |
          cd graalwasm/graalwasm-spring-boot-photon
          ./mvnw --no-transfer-progress clean -Pnative,wasm-debug native:compile
          ./target/demo-wasm-debug &
          apppid="$!"
          trap 'kill "$apppid" 2>/dev/null || true' EXIT
          "$GITHUB_WORKSPACE/.github/scripts/wait-for-http.sh" "$apppid" http://localhost:8080/photo/flipv 120
