name: Check Snippets in GraalPy Guides
on:
  pull_request:
    paths:
      - 'graalpy/**'
      - '.github/workflows/graalpy-check-snippets.yml'
concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Set up Python
      uses: actions/setup-python@v7.1.0
      with:
        python-version: graalpy-25.4.4
    - name: Install dependencies
      run: |
        python -m pip install -r .github/scripts/requirements.txt
    - name: Check README snippets
      run: find graalpy -name "README.md" -exec python .github/scripts/check-snippets.py "{}" "+"
