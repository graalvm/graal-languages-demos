version: 2

multi-ecosystem-groups:
  jvm:
    schedule:
      interval: 'monthly'
  npm:
    schedule:
      interval: 'monthly'
  gha:
    schedule:
      interval: 'monthly'

updates:
  - package-ecosystem: 'maven'
    directories:
      - '**/*'
    patterns: ['*']
    multi-ecosystem-group: 'jvm'

  - package-ecosystem: 'gradle'
    directories:
      - '**/*'
    patterns: ['*']
    multi-ecosystem-group: 'jvm'

  - package-ecosystem: 'npm'
    directories:
      - '**/*'
    patterns: ['*']
    multi-ecosystem-group: 'npm'

  - package-ecosystem: 'github-actions'
    directory: '/'
    patterns: ['*']
    multi-ecosystem-group: 'gha'
